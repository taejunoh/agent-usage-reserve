name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: scripts/build-release.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The one-line installers read main and releases/latest together, so a
        # release is marked Latest only once its commit is on main.
        run: |
          status=$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical|behind) latest=true ;;
            *) latest=false ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --latest="$latest"
